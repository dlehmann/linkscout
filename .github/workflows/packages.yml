# Builds the Debian (.deb) and Arch Linux (.pkg.tar.zst) packages for x86_64
# and arm64 with nfpm (config: packaging/nfpm.yaml) and installs the x86_64
# ones on Debian and Arch once before they are handed on.
#
# release.yml calls it for every version tag and attaches the packages to the
# release. It can also be started by hand (Actions → Packages → Run
# workflow); the packages are then available as the workflow artifact
# "packages", with the version from `git describe`.
name: Packages

on:
  workflow_call:
    inputs:
      version:
        description: Version tag (v1.2.3) or version (1.2.3)
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  NFPM_VERSION: v2.47.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for git describe
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          # by hand between tags: v1.3.0-2-gabc1234 → 1.3.0+r2.gabc1234, valid
          # for dpkg and pacman and newer than 1.3.0 for both
          [ -n "$v" ] || v="$(git describe --tags --always | sed -E 's/^v//; s/-([0-9]+)-g/+r\1.g/')"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version $v"
      - name: Build the Linux binaries
        run: make release VERSION="$VERSION" RELEASE_TARGETS="linux/amd64 linux/arm64"
      - name: Install nfpm
        run: go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@$NFPM_VERSION"
      - name: Build the packages
        run: |
          mkdir -p dist/pkg packages
          for arch in amd64 arm64; do
            cp "dist/linkscout-linux-$arch" dist/pkg/linkscout
            ARCH=$arch nfpm package -f packaging/nfpm.yaml -p deb -t dist/
            ARCH=$arch nfpm package -f packaging/nfpm.yaml -p archlinux -t dist/
          done
          # Names without version, so the website can link to
          # .../releases/latest/download/linkscout-amd64.deb
          for f in dist/*.deb dist/*.pkg.tar.zst; do
            case "$f" in
              *_amd64.deb) to=linkscout-amd64.deb ;;
              *_arm64.deb) to=linkscout-arm64.deb ;;
              *-x86_64.pkg.tar.zst) to=linkscout-x86_64.pkg.tar.zst ;;
              *-aarch64.pkg.tar.zst) to=linkscout-aarch64.pkg.tar.zst ;;
              *) echo "unexpected package $f"; exit 1 ;;
            esac
            mv "$f" "packages/$to"
          done
          ls -l packages
      - name: Install on Debian
        run: |
          docker run --rm -v "$PWD/packages:/p:ro" debian:trixie sh -euc '
            apt-get install -y -qq /p/linkscout-amd64.deb >/dev/null
            linkscout -version
            test -f /usr/share/applications/linkscout.desktop'
      - name: Install on Arch Linux
        run: |
          docker run --rm -v "$PWD/packages:/p:ro" archlinux:latest sh -euc '
            pacman -U --noconfirm /p/linkscout-x86_64.pkg.tar.zst >/dev/null
            linkscout -version
            test -f /usr/share/applications/linkscout.desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/
          retention-days: 7
